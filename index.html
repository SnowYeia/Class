<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>软件2446班课程表</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            /* iOS风格色彩系统 */
            --warm-white: #FAFAF8;
            --background: #F5F5F3;
            --card-background: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --separator: #E5E5E7;
            --accent: #007AFF;
            --success: #34C759;
            --error: #FF3B30;
            
            /* 阴影系统 */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            
            /* 动画时长 */
            --duration-fast: 0.2s;
            --duration-normal: 0.3s;
            --duration-slow: 0.5s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 页面容器 */
        .page-container {
            min-height: 100vh;
            background-color: var(--warm-white);
        }

        /* 导航栏 */
        .navigation-bar {
            background-color: var(--card-background);
            border-bottom: 0.5px solid var(--separator);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @media (max-width: 768px) {
            .navigation-bar {
                padding: 0 16px;
            }
            
            .nav-content {
                height: 44px;
            }
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        /* 状态指示器容器 - 用于动画过渡 */
        .status-container {
            max-height: 200px;
            overflow: hidden;
            transition: max-height var(--duration-slow) ease-out;
        }

        .status-container.hidden {
            max-height: 0;
        }

        /* 状态指示器 */
        .status-indicator {
            background-color: var(--card-background);
            margin: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 1;
            transform: translateY(0);
            transition: all var(--duration-normal) ease;
        }

        @media (max-width: 768px) {
            .status-indicator {
                margin: 16px;
                padding: 12px 16px;
                border-radius: 10px;
            }
        }

        .status-indicator.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .status-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon.loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 15px;
            color: var(--text-secondary);
            flex: 1;
        }

        .status-indicator.success {
            background-color: rgba(52, 199, 89, 0.1);
        }

        .status-indicator.success .status-text {
            color: var(--success);
        }

        .status-indicator.error {
            background-color: rgba(255, 59, 48, 0.1);
        }

        .status-indicator.error .status-text {
            color: var(--error);
        }

        /* 内容区域 */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        @media (max-width: 768px) {
            .content-container {
                padding: 0 16px 32px;
            }
        }

        /* 错误视图 */
        .error-view {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .error-view.active {
            display: block;
            animation: fadeIn var(--duration-normal) ease;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            color: var(--text-tertiary);
        }

        .error-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .error-message {
            font-size: 17px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .retry-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 24px;
            background-color: var(--accent);
            color: white;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            transition: all var(--duration-fast) ease;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .retry-button:hover {
            background-color: #0051D5;
        }

        .retry-button:active {
            transform: scale(0.98);
        }

        /* 课程表容器 */
        .schedule-container {
            display: none;
            animation: fadeIn var(--duration-normal) ease;
        }

        .schedule-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 日期标题 */
        .date-header {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 0;
            align-items: center;
        }

        @media (max-width: 768px) {
            .date-header {
                display: none;
            }
        }

        .date-header-spacer {
            /* 左上角空白区域 */
        }

        .date-item {
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            min-height: 48px;
        }

        .date-weekday {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .date-number {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 课程表网格 */
        .schedule-wrapper {
            background-color: var(--card-background);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            .schedule-wrapper {
                border-radius: 12px;
                margin: 0 -16px;
                box-shadow: none;
                border-top: 0.5px solid var(--separator);
                border-bottom: 0.5px solid var(--separator);
            }
        }

        .schedule-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .schedule-scroll::-webkit-scrollbar {
            display: none;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, minmax(140px, 1fr));
            min-width: 100%;
        }

        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 80px repeat(7, minmax(120px, max-content));
                width: max-content;
            }
        }

        /* 时间列 */
        .time-slot {
            background-color: var(--warm-white);
            padding: 16px 8px;
            text-align: center;
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            position: sticky;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            min-height: 80px;
        }

        .time-period {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .time-range {
            font-size: 10px;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }

        /* 星期标题（移动端） */
        .weekday-header {
            background-color: var(--warm-white);
            padding: 10px 8px;
            text-align: center;
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 44px;
        }

        .weekday-header .date {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: normal;
        }

        /* 课程单元格 */
        .course-cell {
            background-color: var(--card-background);
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            padding: 8px;
            min-height: 80px;
            position: relative;
            transition: background-color var(--duration-fast) ease;
        }

        .course-cell:hover {
            background-color: var(--warm-white);
        }

        .course-cell.merged {
            grid-row: span var(--row-span, 2);
        }

        /* 课程卡片 */
        .course-card {
            background-color: var(--accent);
            color: white;
            padding: 12px;
            border-radius: 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
            position: relative;
            cursor: pointer;
            transition: all var(--duration-fast) ease;
        }

        .course-card:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-md);
        }

        .course-card:active {
            transform: scale(0.98);
        }

        /* 课程颜色 */
        .course-card.color-1 { background-color: #FF9500; }
        .course-card.color-2 { background-color: #AF52DE; }
        .course-card.color-3 { background-color: #5AC8FA; }
        .course-card.color-4 { background-color: #FF2D55; }
        .course-card.color-5 { background-color: #5856D6; }
        .course-card.color-6 { background-color: #34C759; }

        .course-name {
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .course-location {
            font-size: 11px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .course-time {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 9px;
            opacity: 0.8;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* 教师提示 */
        .teacher-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-primary);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-fast) ease;
            z-index: 100;
        }

        .teacher-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--text-primary);
        }

        .course-card:hover .teacher-tooltip {
            opacity: 1;
        }

        @media (hover: none) {
            .course-card:active .teacher-tooltip {
                opacity: 1;
            }
        }

        /* 滚动提示 */
        .scroll-indicator {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--text-primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            animation: slideUp var(--duration-normal) ease;
        }

        @media (max-width: 768px) {
            .scroll-indicator {
                display: block;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .scroll-indicator.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 导航栏 -->
        <nav class="navigation-bar">
            <div class="nav-content">
                <h1 class="nav-title">软件2446班课程表</h1>
            </div>
        </nav>

        <!-- 状态指示器容器 -->
        <div class="status-container" id="statusContainer">
            <div class="status-indicator" id="statusIndicator">
                <div class="status-icon loading" id="statusIcon">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                        <path d="M18 10a8 8 0 01-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="status-text" id="statusText">正在加载课程表...</span>
            </div>
        </div>

        <!-- 内容容器 -->
        <div class="content-container">
            <!-- 错误视图 -->
            <div class="error-view" id="errorView">
                <svg class="error-icon" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2"/>
                    <path d="M32 20v16M32 44h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h2 class="error-title">无法加载课程表</h2>
                <p class="error-message" id="errorMessage">请检查文件是否存在</p>
                <button class="retry-button" onclick="loadSchedule()">重新加载</button>
            </div>

            <!-- 课程表容器 -->
            <div class="schedule-container" id="scheduleContainer">
                <!-- 日期标题 -->
                <div class="date-header" id="dateHeader"></div>
                
                <!-- 课程表 -->
                <div class="schedule-wrapper">
                    <div class="schedule-scroll">
                        <div class="schedule-grid" id="scheduleGrid"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 滚动提示 -->
        <div class="scroll-indicator" id="scrollIndicator">
            左右滑动查看更多 →
        </div>
    </div>

    <script>
        // 课程时间配置
        const TIME_SLOTS = [
            { period: '1', time: '8:00-8:45' },
            { period: '2', time: '8:55-9:40' },
            { period: '3', time: '10:00-10:45' },
            { period: '4', time: '10:55-11:40' },
            { period: '5', time: '14:30-15:15' },
            { period: '6', time: '15:25-16:10' },
            { period: '7', time: '16:25-17:10' },
            { period: '8', time: '17:15-18:00' },
            { period: '9-10', time: '19:15-20:45' }
        ];

        const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        
        // 课程颜色映射
        const courseColorMap = new Map();
        let colorIndex = 0;

        // 状态管理
        function updateStatus(type, message) {
            const container = document.getElementById('statusContainer');
            const indicator = document.getElementById('statusIndicator');
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusText');
            
            indicator.className = `status-indicator ${type}`;
            text.textContent = message;
            
            switch (type) {
                case 'loading':
                    icon.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                            <path d="M18 10a8 8 0 01-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    `;
                    icon.className = 'status-icon loading';
                    break;
                case 'success':
                    icon.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    `;
                    icon.className = 'status-icon';
                    
                    // 平滑过渡隐藏状态栏
                    setTimeout(() => {
                        indicator.classList.add('fade-out');
                        setTimeout(() => {
                            container.classList.add('hidden');
                        }, 300);
                    }, 2000);
                    break;
                case 'error':
                    icon.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    `;
                    icon.className = 'status-icon';
                    break;
            }
        }

        // 显示错误
        function showError(message) {
            updateStatus('error', '加载失败');
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorView').classList.add('active');
            document.getElementById('scheduleContainer').classList.remove('active');
        }

        // 加载课程表
        async function loadSchedule() {
            document.getElementById('errorView').classList.remove('active');
            const container = document.getElementById('statusContainer');
            const indicator = document.getElementById('statusIndicator');
            
            // 重置状态栏
            container.classList.remove('hidden');
            indicator.classList.remove('fade-out');
            
            updateStatus('loading', '正在加载课程数据...');
            
            try {
                const response = await fetch('./c.xlsx');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                processScheduleData(data);
                updateStatus('success', '课程表加载完成');
                
            } catch (error) {
                console.error('加载错误:', error);
                let errorMessage = '无法加载课程表文件';
                
                if (error.message.includes('404')) {
                    errorMessage = '找不到文件 c.xlsx';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage = '请通过 Web 服务器访问此页面';
                }
                
                showError(errorMessage);
            }
        }

        // 处理课程数据
        function processScheduleData(data) {
            const courses = [];
            const dateMap = new Map();
            
            // 筛选软件2446班级数据
            const filtered = data.filter(row => {
                return row[5] && String(row[5]).includes('软件2446');
            });
            
            if (filtered.length === 0) {
                showError('未找到软件2446班级的课程');
                return;
            }
            
            // 解析课程
            filtered.forEach(row => {
                const course = {
                    teacher: row[4] || '未指定',
                    weekday: parseInt(row[9]),
                    periods: parsePeriods(row[10]),
                    name: row[6],
                    location: row[12] || '未指定',
                    date: row[16]
                };
                
                if (course.weekday && course.name) {
                    courses.push(course);
                    if (course.date && !dateMap.has(course.weekday)) {
                        dateMap.set(course.weekday, formatDate(course.date));
                    }
                }
            });
            
            renderSchedule(courses, dateMap);
        }

        // 解析节次
        function parsePeriods(str) {
            const match = str.match(/(\d+)(?:-(\d+))?/);
            if (match) {
                return {
                    start: parseInt(match[1]),
                    end: parseInt(match[2] || match[1])
                };
            }
            return { start: 1, end: 1 };
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        // 渲染课程表
        function renderSchedule(courses, dateMap) {
            // 渲染日期标题（桌面端）
            const dateHeader = document.getElementById('dateHeader');
            dateHeader.innerHTML = '';
            
            // 添加左上角空白
            const spacer = document.createElement('div');
            spacer.className = 'date-header-spacer';
            dateHeader.appendChild(spacer);
            
            // 添加星期标题
            for (let i = 1; i <= 7; i++) {
                const dateItem = document.createElement('div');
                dateItem.className = 'date-item';
                dateItem.innerHTML = `
                    <div class="date-weekday">${WEEKDAYS[i - 1]}</div>
                    <div class="date-number">${dateMap.get(i) || ''}</div>
                `;
                dateHeader.appendChild(dateItem);
            }
            
            // 创建课程矩阵
            const matrix = Array(9).fill(null).map(() => Array(7).fill(null));
            const merged = Array(9).fill(null).map(() => Array(7).fill(false));
            
            // 填充课程数据
            courses.forEach(course => {
                const col = course.weekday - 1;
                const startRow = course.periods.start - 1;
                const endRow = course.periods.end - 1;
                
                if (startRow >= 8) {
                    matrix[8][col] = course;
                } else {
                    for (let row = startRow; row <= endRow && row < 9; row++) {
                        if (row === startRow) {
                            matrix[row][col] = {
                                ...course,
                                isMerged: endRow > startRow,
                                rowSpan: endRow - startRow + 1
                            };
                        } else {
                            merged[row][col] = true;
                        }
                    }
                }
            });
            
            // 渲染网格
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';
            
            // 添加空角
            const corner = document.createElement('div');
            corner.className = 'time-slot';
            corner.style.border = 'none';
            grid.appendChild(corner);
            
            // 添加星期标题（移动端）
            if (window.innerWidth <= 768) {
                for (let i = 0; i < 7; i++) {
                    const header = document.createElement('div');
                    header.className = 'weekday-header';
                    const date = dateMap.get(i + 1);
                    header.innerHTML = `
                        <span>${WEEKDAYS[i]}</span>
                        ${date ? `<span class="date">${date}</span>` : ''}
                    `;
                    grid.appendChild(header);
                }
            } else {
                // 桌面端空白
                for (let i = 0; i < 7; i++) {
                    const empty = document.createElement('div');
                    empty.style.borderBottom = '0.5px solid var(--separator)';
                    empty.style.borderRight = '0.5px solid var(--separator)';
                    grid.appendChild(empty);
                }
            }
            
            // 渲染课程格子
            for (let row = 0; row < 9; row++) {
                // 时间列
                const timeSlot = document.createElement('div');
                timeSlot.className = 'time-slot';
                timeSlot.innerHTML = `
                    <div class="time-period">${TIME_SLOTS[row].period}节</div>
                    <div class="time-range">${TIME_SLOTS[row].time}</div>
                `;
                grid.appendChild(timeSlot);
                
                // 课程列
                for (let col = 0; col < 7; col++) {
                    if (merged[row][col]) continue;
                    
                    const cell = document.createElement('div');
                    cell.className = 'course-cell';
                    
                    const course = matrix[row][col];
                    if (course) {
                        if (course.isMerged) {
                            cell.classList.add('merged');
                            cell.style.setProperty('--row-span', course.rowSpan);
                        }
                        
                        // 分配颜色
                        if (!courseColorMap.has(course.name)) {
                            courseColorMap.set(course.name, (colorIndex++ % 6) + 1);
                        }
                        
                        const card = document.createElement('div');
                        card.className = `course-card color-${courseColorMap.get(course.name)}`;
                        
                        // 计算时间范围
                        let timeRange = '';
                        if (course.isMerged) {
                            const start = TIME_SLOTS[row].time.split('-')[0];
                            const endIdx = Math.min(row + course.rowSpan - 1, 8);
                            const end = TIME_SLOTS[endIdx].time.split('-')[1];
                            timeRange = `${start}-${end}`;
                        }
                        
                        card.innerHTML = `
                            <div class="teacher-tooltip">👨‍🏫 ${course.teacher}</div>
                            <div class="course-name">${course.name}</div>
                            <div class="course-location">
                                <span>📍</span>
                                <span>${course.location}</span>
                            </div>
                            ${timeRange ? `<div class="course-time">${timeRange}</div>` : ''}
                        `;
                        
                        cell.appendChild(card);
                    }
                    
                    grid.appendChild(cell);
                }
            }
            
            // 显示课程表
            document.getElementById('scheduleContainer').classList.add('active');
            
            // 移动端滚动提示
            if (window.innerWidth <= 768) {
                const scrollIndicator = document.getElementById('scrollIndicator');
                setTimeout(() => {
                    scrollIndicator.classList.remove('hidden');
                }, 500);
                
                // 滚动后隐藏提示
                document.querySelector('.schedule-scroll').addEventListener('scroll', function() {
                    scrollIndicator.classList.add('hidden');
                }, { once: true });
                
                // 5秒后自动隐藏
                setTimeout(() => {
                    scrollIndicator.classList.add('hidden');
                }, 5000);
            }
        }

        // 页面加载时自动加载
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadSchedule, 100);
        });
    </script>
</body>
</html>
