<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>软件2446 课程表</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            /* iOS风格色彩系统 */
            --warm-white: #FAFAF8;
            --pure-white: #FFFFFF;
            --light-gray: #F2F2F7;
            --medium-gray: #E5E5EA;
            --separator: #C6C6C8;
            --text-primary: #000000;
            --text-secondary: #3C3C43;
            --text-tertiary: #8E8E93;
            --system-blue: #007AFF;
            --system-green: #34C759;
            --system-red: #FF3B30;
            
            /* 阴影系统 */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            
            /* 动画时长 */
            --animation-fast: 0.2s;
            --animation-normal: 0.35s;
            --animation-slow: 0.5s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background-color: var(--warm-white);
            color: var(--text-primary);
            line-height: 1.47059;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.022em;
        }

        /* 容器设计 */
        .container {
            min-height: 100vh;
            background-color: var(--warm-white);
        }

        /* 导航栏设计 */
        .navigation-bar {
            background-color: var(--pure-white);
            border-bottom: 0.5px solid var(--separator);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.41px;
            color: var(--text-primary);
        }

        /* 内容区域 */
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .content {
                padding: 16px;
            }
        }

        /* 状态卡片 */
        .status-card {
            background-color: var(--pure-white);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            transition: all var(--animation-normal) cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .status-card.loading {
            background-color: var(--light-gray);
        }

        .status-card.success {
            background-color: rgba(52, 199, 89, 0.1);
        }

        .status-card.error {
            background-color: rgba(255, 59, 48, 0.1);
        }

        .status-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .status-spinner {
            border: 2px solid var(--medium-gray);
            border-top-color: var(--system-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 15px;
            color: var(--text-secondary);
            letter-spacing: -0.24px;
        }

        /* 错误视图 */
        .error-view {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .error-view.show {
            display: block;
            animation: fadeIn var(--animation-normal) ease-out;
        }

        .error-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            color: var(--system-red);
        }

        .error-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.41px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .retry-button {
            display: inline-block;
            background-color: var(--system-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 22px;
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            transition: all var(--animation-fast) ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .retry-button:hover {
            background-color: #0051D5;
            transform: scale(0.98);
        }

        .retry-button:active {
            transform: scale(0.95);
        }

        /* 日期选择器 */
        .date-selector {
            background-color: var(--pure-white);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            display: none;
        }

        .date-selector.show {
            display: block;
            animation: fadeIn var(--animation-normal) ease-out;
        }

        .date-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .date-list::-webkit-scrollbar {
            display: none;
        }

        .date-item {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all var(--animation-fast) ease;
            background-color: var(--light-gray);
        }

        .date-item:hover {
            background-color: var(--medium-gray);
        }

        .date-item.active {
            background-color: var(--system-blue);
            color: white;
        }

        .date-weekday {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.08px;
            margin-bottom: 2px;
        }

        .date-day {
            font-size: 11px;
            opacity: 0.8;
        }

        /* 课程表容器 */
        .schedule-container {
            background-color: var(--pure-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            display: none;
        }

        .schedule-container.show {
            display: block;
            animation: slideUp var(--animation-normal) ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 课程表网格 */
        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            min-width: 100%;
        }

        @media (max-width: 768px) {
            .schedule-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .schedule-grid {
                grid-template-columns: 70px repeat(7, 120px);
            }
        }

        /* 时间标签 */
        .time-label {
            background-color: var(--light-gray);
            padding: 12px 8px;
            text-align: center;
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            position: sticky;
            left: 0;
            z-index: 10;
        }

        .time-period {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .time-range {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* 星期标题 */
        .weekday-header {
            background-color: var(--light-gray);
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            letter-spacing: -0.08px;
        }

        /* 课程单元格 */
        .course-cell {
            background-color: var(--pure-white);
            border-right: 0.5px solid var(--separator);
            border-bottom: 0.5px solid var(--separator);
            padding: 8px;
            min-height: 60px;
            position: relative;
            transition: background-color var(--animation-fast) ease;
        }

        .course-cell:hover {
            background-color: var(--light-gray);
        }

        .course-cell.has-course {
            padding: 4px;
        }

        /* 课程项目 */
        .course-item {
            background-color: var(--system-blue);
            color: white;
            padding: 8px;
            border-radius: 6px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            line-height: 1.3;
            letter-spacing: -0.08px;
            cursor: pointer;
            transition: all var(--animation-fast) ease;
            position: relative;
            overflow: hidden;
        }

        .course-item:hover {
            transform: scale(0.98);
            box-shadow: var(--shadow-md);
        }

        .course-item:active {
            transform: scale(0.95);
        }

        /* 课程颜色变体 */
        .course-item.color-1 { background-color: #FF9500; }
        .course-item.color-2 { background-color: #AF52DE; }
        .course-item.color-3 { background-color: #5AC8FA; }
        .course-item.color-4 { background-color: #FF2D55; }
        .course-item.color-5 { background-color: #5856D6; }
        .course-item.color-6 { background-color: #34C759; }

        .course-name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .course-location {
            font-size: 11px;
            opacity: 0.9;
        }

        /* 课程详情弹出层 */
        .course-detail {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all var(--animation-fast) ease;
            margin-bottom: 8px;
        }

        .course-detail::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--text-primary);
        }

        .course-item:hover .course-detail {
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .course-detail {
                display: none;
            }
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 合并单元格支持 */
        .course-cell.merged {
            grid-row: span var(--span-rows, 1);
        }

        .course-item.merged {
            height: 100%;
        }

        /* 时间胶囊 */
        .time-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navigation-bar">
            <div class="nav-content">
                <h1 class="nav-title">软件2446 课程表</h1>
            </div>
        </nav>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 状态提示 -->
            <div class="status-card loading" id="statusCard">
                <div class="status-icon status-spinner" id="statusIcon"></div>
                <span class="status-text" id="statusText">正在加载课程数据...</span>
            </div>

            <!-- 错误视图 -->
            <div class="error-view" id="errorView">
                <svg class="error-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <h2 class="error-title">无法加载课程表</h2>
                <p class="error-message" id="errorMessage">请检查文件是否存在</p>
                <button class="retry-button" onclick="loadSchedule()">重新加载</button>
            </div>

            <!-- 日期选择器 -->
            <div class="date-selector" id="dateSelector">
                <div class="date-list" id="dateList">
                    <!-- 动态生成日期 -->
                </div>
            </div>

            <!-- 课程表 -->
            <div class="schedule-container" id="scheduleContainer">
                <div class="schedule-scroll">
                    <div class="schedule-grid" id="scheduleGrid">
                        <!-- 动态生成课程表 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 时间段定义
        const TIME_PERIODS = [
            { period: '1', time: '8:00-8:45' },
            { period: '2', time: '8:55-9:40' },
            { period: '3', time: '10:00-10:45' },
            { period: '4', time: '10:55-11:40' },
            { period: '5', time: '14:30-15:15' },
            { period: '6', time: '15:25-16:10' },
            { period: '7', time: '16:25-17:10' },
            { period: '8', time: '17:15-18:00' },
            { period: '9-10', time: '19:15-20:45' }
        ];

        const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        
        // 课程颜色映射
        const courseColorMap = new Map();
        let colorIndex = 0;

        // 更新状态
        function updateStatus(type, message) {
            const card = document.getElementById('statusCard');
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusText');
            
            card.className = `status-card ${type}`;
            text.textContent = message;
            
            switch(type) {
                case 'loading':
                    icon.className = 'status-icon status-spinner';
                    break;
                case 'success':
                    icon.className = 'status-icon';
                    icon.innerHTML = '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>';
                    icon.style.color = 'var(--system-green)';
                    setTimeout(() => {
                        card.style.opacity = '0';
                        setTimeout(() => card.style.display = 'none', 300);
                    }, 2000);
                    break;
                case 'error':
                    icon.className = 'status-icon';
                    icon.innerHTML = '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>';
                    icon.style.color = 'var(--system-red)';
                    break;
            }
        }

        // 显示错误
        function showError(message) {
            updateStatus('error', '加载失败');
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorView').classList.add('show');
            document.getElementById('dateSelector').classList.remove('show');
            document.getElementById('scheduleContainer').classList.remove('show');
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('errorView').classList.remove('show');
        }

        // 加载课程表
        async function loadSchedule() {
            hideError();
            updateStatus('loading', '正在加载课程数据...');
            
            try {
                const response = await fetch('./c.xlsx');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.arrayBuffer();
                const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                
                processScheduleData(jsonData);
                updateStatus('success', '加载成功');
                
            } catch (error) {
                console.error('Error:', error);
                let message = '无法加载课程表文件';
                
                if (error.message.includes('404')) {
                    message = '找不到文件 c.xlsx';
                } else if (error.message.includes('Failed to fetch')) {
                    message = '请通过 Web 服务器访问此页面';
                }
                
                showError(message);
            }
        }

        // 处理课程数据
        function processScheduleData(data) {
            const courses = [];
            const dateMap = new Map();
            
            // 筛选软件2446的课程
            const filtered = data.filter(row => {
                return row[5] && String(row[5]).includes('软件2446');
            });
            
            if (filtered.length === 0) {
                showError('未找到软件2446班级的课程');
                return;
            }
            
            // 解析数据
            filtered.forEach(row => {
                const teacher = row[4] || '';
                const weekday = parseInt(row[9]);
                const date = row[16];
                const periodStr = row[10];
                const courseName = row[6];
                const location = row[12] || '';
                
                if (weekday && periodStr && courseName) {
                    if (date && !dateMap.has(weekday)) {
                        const d = new Date(date);
                        dateMap.set(weekday, `${d.getMonth() + 1}.${d.getDate()}`);
                    }
                    
                    const periods = parsePeriods(periodStr);
                    courses.push({
                        teacher,
                        weekday,
                        periods,
                        courseName,
                        location
                    });
                }
            });
            
            generateSchedule(courses, dateMap);
        }

        // 解析节次
        function parsePeriods(str) {
            const match = str.match(/(\d+)(?:-(\d+))?/);
            if (match) {
                const start = parseInt(match[1]);
                const end = match[2] ? parseInt(match[2]) : start;
                return { start, end };
            }
            return { start: 1, end: 1 };
        }

        // 生成日期选择器
        function generateDateSelector(dateMap) {
            const dateList = document.getElementById('dateList');
            dateList.innerHTML = '';
            
            for (let i = 1; i <= 7; i++) {
                const item = document.createElement('div');
                item.className = 'date-item';
                if (i === 1) item.classList.add('active');
                
                item.innerHTML = `
                    <div class="date-weekday">${WEEKDAYS[i - 1]}</div>
                    <div class="date-day">${dateMap.get(i) || ''}</div>
                `;
                
                item.onclick = () => {
                    document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    // 可以在这里添加切换到特定日期的逻辑
                };
                
                dateList.appendChild(item);
            }
            
            document.getElementById('dateSelector').classList.add('show');
        }

        // 生成课程表
        function generateSchedule(courses, dateMap) {
            generateDateSelector(dateMap);
            
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';
            
            // 创建课程矩阵
            const matrix = Array(9).fill(null).map(() => Array(7).fill(null));
            const merged = Array(9).fill(null).map(() => Array(7).fill(false));
            
            // 填充课程
            courses.forEach(course => {
                const col = course.weekday - 1;
                const startRow = course.periods.start - 1;
                const endRow = course.periods.end - 1;
                
                if (startRow >= 8) {
                    matrix[8][col] = course;
                } else {
                    for (let r = startRow; r <= endRow && r < 9; r++) {
                        if (r === startRow) {
                            matrix[r][col] = {
                                ...course,
                                isMerged: endRow > startRow,
                                spanRows: endRow - startRow + 1
                            };
                        } else {
                            merged[r][col] = true;
                        }
                    }
                }
            });
            
            // 添加时间列标题
            const cornerCell = document.createElement('div');
            cornerCell.className = 'time-label';
            cornerCell.style.borderTop = '0.5px solid var(--separator)';
            cornerCell.style.borderLeft = '0.5px solid var(--separator)';
            grid.appendChild(cornerCell);
            
            // 添加星期标题
            for (let i = 0; i < 7; i++) {
                const header = document.createElement('div');
                header.className = 'weekday-header';
                header.textContent = WEEKDAYS[i];
                if (i === 0) header.style.borderTop = '0.5px solid var(--separator)';
                grid.appendChild(header);
            }
            
            // 生成课程格子
            for (let row = 0; row < 9; row++) {
                // 时间标签
                const timeLabel = document.createElement('div');
                timeLabel.className = 'time-label';
                if (row === 0) timeLabel.style.borderLeft = '0.5px solid var(--separator)';
                timeLabel.innerHTML = `
                    <div class="time-period">第${TIME_PERIODS[row].period}节</div>
                    <div class="time-range">${TIME_PERIODS[row].time}</div>
                `;
                grid.appendChild(timeLabel);
                
                // 课程单元格
                for (let col = 0; col < 7; col++) {
                    if (merged[row][col]) continue;
                    
                    const cell = document.createElement('div');
                    cell.className = 'course-cell';
                    
                    const course = matrix[row][col];
                    if (course) {
                        cell.classList.add('has-course');
                        
                        if (course.isMerged) {
                            cell.classList.add('merged');
                            cell.style.setProperty('--span-rows', course.spanRows);
                        }
                        
                        // 分配颜色
                        if (!courseColorMap.has(course.courseName)) {
                            courseColorMap.set(course.courseName, (colorIndex++ % 6) + 1);
                        }
                        
                        const item = document.createElement('div');
                        item.className = `course-item color-${courseColorMap.get(course.courseName)}`;
                        if (course.isMerged) item.classList.add('merged');
                        
                        let content = `
                            <div class="course-detail">
                                👨‍🏫 ${course.teacher}
                            </div>
                            <div class="course-name">${course.courseName}</div>
                            <div class="course-location">📍 ${course.location}</div>
                        `;
                        
                        if (course.isMerged) {
                            const startTime = TIME_PERIODS[row].time.split('-')[0];
                            const endTime = TIME_PERIODS[Math.min(row + course.spanRows - 1, 8)].time.split('-')[1];
                            content += `<div class="time-badge">🕐 ${startTime}-${endTime}</div>`;
                        }
                        
                        item.innerHTML = content;
                        cell.appendChild(item);
                    }
                    
                    grid.appendChild(cell);
                }
            }
            
            document.getElementById('scheduleContainer').classList.add('show');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadSchedule, 100);
        });
    </script>
</body>
</html>
